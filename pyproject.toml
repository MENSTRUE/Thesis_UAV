[project]
name = "drone-human-gesture"
version = "1.0.0"
description = "Human action recognition + face recognition off-board untuk UAV DJI Tello"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python>=4.10",
    "onnx>=1.16",
    "djitellopy>=2.5",
    "insightface>=0.7.3",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "av>=11,<18",
    "scipy>=1.11",
]

[dependency-groups]
# GPU (default untuk `uv run`/`uv sync`). YOLO deteksi/pose kini via ONNX
# Runtime juga — tidak ada torch sama sekali, footprint kecil (~300MB).
# CPU/DML via scripts/setup.ps1 -CPU/-DML (memakai requirements/*.txt).
gpu = [
    "onnxruntime-gpu==1.20.2",
    # onnxruntime-gpu TIDAK mem-bundle cudart/cublas/cudnn; DLL-nya disuplai
    # paket nvidia-* ini (dulu otomatis ikut torch, sekarang eksplisit).
    "nvidia-cublas-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cufft-cu12",
    "nvidia-nvjitlink-cu12",
]

[tool.uv]
default-groups = ["gpu"]
# onnxruntime (CPU) dan onnxruntime-gpu memasang modul yang sama; insightface
# menarik onnxruntime → konflik. Eksklusi onnxruntime supaya onnxruntime-gpu
# (dari grup gpu) jadi satu-satunya ORT aktif (CUDA).
exclude-dependencies = ["onnxruntime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]